<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calcultor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>BMI Calculator</h1>
      <img src="assets/BMI logo.png" alt="" width="100px" height="100px" />
    </header>

    <form action="">
      <div>
        <label for="gender">Gender: </label>
        <input type="radio" name="gender" id="gender" value="male" />Male
        <input type="radio" name="gender" id="gender" value="Female" />Female
      </div>

      <div>
        <label for="age">Age: </label>
        <input type="number" min="1" name="age" id="age" />
      </div>

      <div>
        <label for="height">Height(cm): </label>
        <input type="number" min="10" name="height" id="height" />
      </div>

      <div>
        <label for="weight">Weight <i>(kg)</i>:</label>
        <input type="number" min="1" name="weight" id="weight" />
      </div>

      <button onclick="cal()" type="button">Calculate BMI</button>
      <div class="results">
        <h2>Results:</h2>
        <h2 id="results">00.0</h2>
      </div>
    </form>

    <script src="script.js"></script>
  </body>
</html>
