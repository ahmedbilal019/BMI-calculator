<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calcultor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>BMI Calculator</h1>
      <img src="assets/BMI logo.png" alt="" width="100px" height="100px" />
    </header>

    <form action="">
      <div class="gender">
        <label for="gender">Gender: </label>
        <div>
          <input type="radio" name="gender" id="gender" value="male" />Male
        </div>
        <div>
          <input type="radio" name="gender" id="gender" value="Female" />Female
        </div>
      </div>

      <div>
        <label for="age">Age: </label>
        <input type="number" min="1" name="age" id="age" required />
      </div>

      <div>
        <label for="height">Height(cm): </label>
        <input type="number" min="10" name="height" id="height" required />
      </div>

      <div>
        <label for="weight">Weight <i>(kg)</i>:</label>
        <input type="number" min="1" name="weight" id="weight" required />
      </div>

      <button onclick="cal()" type="button">Calculate BMI</button>
      <div class="results">
        <h4>Your BMI value is :</h4>
        <h4 id="results">00.0</h4>
      </div>
      <p
        id="message"
        style="
          background-color: white;
          margin: auto;
          font-weight: bold;
          
        "
      ></p>
    </form>

    <script src="script.js"></script>
  </body>
</html>
